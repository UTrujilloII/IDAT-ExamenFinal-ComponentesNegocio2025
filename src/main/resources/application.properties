# 1. Configuración del Servidor (Puerto)
server.port=8080

# 2. Configuración de la Base de Datos (MySQL)
# Asegúrate de crear una base de datos vacía llamada 'biblioteca_db' en tu MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/biblioteca_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Configuración de JPA / Hibernate (Clave para la Rúbrica)
# 'update': Crea/actualiza las tablas automáticamente según tus Entidades Java.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect