spring.application.name=biblioteca-api
# ===========================================
# CONFIGURACI\uFFFDN DE BASE DE DATOS
# ===========================================
#spring.datasource.url=jdbc:mysql://localhost:3306/biblioteca_db?useSSL=false&serverTimezone=UTC
spring.datasource.url=jdbc:mysql://localhost:3306/biblioteca_db?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Palito2020

# ===========================================
# CONFIGURACI\uFFFDN JPA / HIBERNATE
# ===========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto recomendado para MySQL 9.x
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===========================================
# PUERTO DE LA APLICACI\uFFFDN
# ===========================================
server.port=8080

